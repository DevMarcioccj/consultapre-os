name: Build EXE (Windows)
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyinstaller playwright beautifulsoup4 pandas openpyxl requests
      - run: pyinstaller --onefile --name monitor_bebidas --collect-all playwright --collect-all openpyxl monitor_bebidas.py
      - uses: actions/upload-artifact@v4
        with:
          name: monitor_bebidas-windows
          path: dist/monitor_bebidas.exe
